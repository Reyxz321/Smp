#Minecraft server properties
# ============================================================
# SMP server.properties  (Paper 26.x / 1.21.x)
# Drop this file into your server folder and restart.
# Values below are tuned for a public cracked-mode SMP.
# ============================================================

# --- CRACKED MODE (required for non-premium players) ---
# offline mode: players are NOT verified against Mojang.
# This is what allows cracked accounts. AuthMeReloaded + LuckPerms
# become your account/security layer - see docs/SETUP-GUIDE.md.
online-mode=false

# Required for offline mode since 1.19.1: stops clients from being
# kicked with "secure profile" errors on a cracked server.
enforce-secure-profile=false

# --- Connection ---
server-port=25565
max-players=80

# --- Performance / distances ---
# 12GB RAM handles these easily with pre-generated chunks (Chunky).
view-distance=8
simulation-distance=5
spawn-protection=0

# --- World ---
level-name=world
level-seed=
gamemode=survival
difficulty=hard
hardcore=false
pvp=true
max-world-size=10000
sync-chunk-writes=true
allow-flight=false

# --- Access ---
white-list=false
enable-command-block=false

# --- MOTD (use \u00A7 for the & color code) ---
motd=\u00A7c\u00A7lSMP \u00A7r\u00A77\» \u00A76Donut-Style Survival \u00A77\» \u00A7a/register \u00A77& \u00A7a/login

enable-status=true
