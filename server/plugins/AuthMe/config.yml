# ============================================================
#  AuthMeReloaded 6.0.0 - HARDENED config for a cracked SMP
# ============================================================
#  WHERE:  plugins/AuthMe/config.yml   (replace the generated one)
#  HOW:    1) Boot the server once with AuthMe installed so the
#              plugins/AuthMe folder is created.
#          2) Stop the server, overwrite config.yml with this file.
#          3) Create the LuckPerms group "authme-unlogged" BEFORE
#              letting players join (see docs/SETUP-GUIDE.md step 7).
#          4) Start the server. Test with /authme register test pass pass
#              then /authme login test pass.
#
#  [HARDENED] = changed from the default for maximum safety.
#  Everything else = left at the AuthMe 6.0.0 default.
# ============================================================

DataSource:
    # What type of database do you want to use?
    # Valid values: SQLITE, MARIADB, MYSQL, POSTGRESQL
    # SQLite = zero setup, perfect for a single home server.
    # Switch to MySQL/MariaDB only if you grow to multiple servers.
    backend: SQLITE
    # Enable the database caching system, should be disabled on bungeecord environments
    # or when a website integration is being used.
    caching: true
    # Database host address
    mySQLHost: 127.0.0.1
    # Database port
    mySQLPort: '3306'
    # Connect to MySQL database over SSL
    mySQLUseSSL: true
    # Verification of server's certificate.
    # We would not recommend to set this option to false.
    # Set this option to false at your own risk if and only if you know what you're doing
    mySQLCheckServerCertificate: true
    # Authorize client to retrieve RSA server public key.
    # Advanced option, ignore if you don't know what it means.
    mySQLAllowPublicKeyRetrieval: true
    # Username to connect to the MySQL database
    mySQLUsername: authme
    # Password to connect to the MySQL database
    mySQLPassword: '12345'
    # Database Name, use with converters or as SQLITE database name
    mySQLDatabase: authme
    # Table of the database
    mySQLTablename: authme
    # Column of IDs to sort data
    mySQLColumnId: id
    # Column for storing or checking players nickname
    mySQLColumnName: username
    # Column for storing or checking players RealName
    mySQLRealName: realname
    # Column for storing players passwords
    mySQLColumnPassword: password
    # Column for storing players passwords salts
    mySQLColumnSalt: ''
    # Column for storing players emails
    mySQLColumnEmail: email
    # Column for storing if a player is logged in or not
    mySQLColumnLogged: isLogged
    # Column for storing if a player has a valid session or not
    mySQLColumnHasSession: hasSession
    # Column for storing a player's TOTP key (for two-factor authentication)
    mySQLtotpKey: totp
    # Column for storing the player's last IP
    mySQLColumnIp: ip
    # Column for storing players lastlogins
    mySQLColumnLastLogin: lastlogin
    # Column storing the registration date
    mySQLColumnRegisterDate: regdate
    # Column for storing the IP address at the time of registration
    mySQLColumnRegisterIp: regip
    # Column for storing player LastLocation - X
    mySQLlastlocX: x
    # Column for storing player LastLocation - Y
    mySQLlastlocY: y
    # Column for storing player LastLocation - Z
    mySQLlastlocZ: z
    # Column for storing player LastLocation - World Name
    mySQLlastlocWorld: world
    # Column for storing player LastLocation - Yaw
    mySQLlastlocYaw: yaw
    # Column for storing player LastLocation - Pitch
    mySQLlastlocPitch: pitch
    # Column for storing players uuids (optional)
    mySQLPlayerUUID: ''
    # Column for storing the Mojang UUID of premium players
    # (null if premium mode is off for this player)
    mySQLColumnPremiumUUID: premiumUUID
    # Overrides the size of the DB Connection Pool, default = 10
    poolSize: 10
    # The maximum lifetime of a connection in the pool, default = 1800 seconds
    # You should set this at least 30 seconds less than mysql server wait_timeout
    maxLifetime: 1800
ExternalBoardOptions:
    # Column for storing players groups
    mySQLColumnGroup: ''
    # -1 means disabled. If you want that only activated players
    # can log into your server, you can set here the group number
    # of unactivated users, needed for some forum/CMS support
    nonActivedUserGroup: -1
    # Other MySQL columns where we need to put the username (case-sensitive)
    mySQLOtherUsernameColumns: []
    # How much log2 rounds needed in BCrypt (do not change if you do not know what it does)
    # [HARDENED] kept at 12 - this is the cost factor for BCRYPT2Y (see settings.security below)
    bCryptLog2Round: 12
    # phpBB table prefix defined during the phpBB installation process
    phpbbTablePrefix: phpbb_
    # phpBB activated group ID; 2 is the default registered group defined by phpBB
    phpbbActivatedGroupId: 2
    # IP Board table prefix defined during the IP Board installation process
    IPBTablePrefix: ipb_
    # IP Board default group ID; 3 is the default registered group defined by IP Board
    IPBActivatedGroupId: 3
    # Xenforo table prefix defined during the Xenforo installation process
    XFTablePrefix: xf_
    # XenForo default group ID; 2 is the default registered group defined by Xenforo
    XFActivatedGroupId: 2
    # Wordpress prefix defined during WordPress installation
    wordpressTablePrefix: wp_
settings:
    sessions:
        # Do you want to enable the session feature?
        # If enabled, when a player authenticates successfully,
        # his IP and his nickname is saved.
        # The next time the player joins the server, if his IP
        # is the same as last time and the timeout hasn't
        # expired, he will not need to authenticate.
        # [HARDENED] disabled: every join requires /login, even from the
        # same IP. Session files can be stolen by IP spoofing on cracked servers.
        enabled: false
        # After how many minutes should a session expire?
        # A player's session ends after the timeout or if his IP has changed
        timeout: 10
    # Message language, available languages:
    # https://github.com/AuthMe/AuthMeReloaded/blob/master/docs/translations.md
    messagesLanguage: en
    # When enabled, messages are sent to each player in their client language,
    # falling back to messagesLanguage if their locale is unavailable.
    # Disable this if you want all players to receive messages in the same language.
    perPlayerLocale: true
    # Forces authme to hook into Vault instead of a specific permission handler system.
    # [HARDENED] true: we run LuckPerms + Vault, this makes the hook explicit.
    forceVaultHook: true
    # Log level: INFO, FINE, DEBUG. Use INFO for general messages,
    # FINE for some additional detailed ones (like password failed),
    # and DEBUG for debugging
    # [HARDENED] FINE logs failed logins (useful to spot brute-force attempts)
    logLevel: FINE
    # Whether to run authentication work (password hashing, database queries) on async threads.
    # When true (strongly recommended), all CPU-intensive and I/O-bound operations — including
    # password hashing and database access — are offloaded from the main server thread, keeping
    # the server responsive during login and registration.
    useAsyncTasks: true
    # The name of the server, used in some placeholders.
    serverName: SMP
    restrictions:
        # Can not authenticated players chat?
        # Keep in mind that this feature also blocks all commands not
        # listed in the list below.
        # [HARDENED] false = unlogged players cannot chat
        allowChat: false
        # Hide the chat log from players who are not authenticated?
        # [HARDENED] true = even *seeing* other chat requires login
        hideChat: true
        # Allowed commands for unauthenticated players
        allowCommands:
        - /login
        - /log
        - /l
        - /register
        - /reg
        - /email
        - /captcha
        - /2fa
        - /totp
        # Max number of allowed registrations per IP
        # The value 0 means an unlimited number of registrations!
        # [HARDENED] 1 = one account per IP. Family on the same router?
        # Raise to 2-3, but 1 is the safest.
        maxRegPerIp: 1
        # Minimum allowed username length
        minNicknameLength: 3
        # Maximum allowed username length
        maxNicknameLength: 16
        # When this setting is enabled, online players can't be kicked out
        # due to "Logged in from another Location"
        # This setting will prevent potential security exploits.
        # [HARDENED] true = account sharing / session hijacking is blocked
        ForceSingleSession: true
        ForceSpawnLocOnJoin:
            # If enabled, every player that spawn in one of the world listed in
            # "ForceSpawnLocOnJoin.worlds" will be teleported to the spawnpoint after successful
            # authentication. The quit location of the player will be overwritten.
            enabled: false
            # WorldNames where we need to force the spawn location
            # Case-sensitive!
            worlds:
            - world
            - world_nether
            - world_the_end
        # This option will save the quit location of the players.
        SaveQuitLocation: false
        # To activate the restricted user feature you need
        # to enable this option and configure the AllowedRestrictedUser field.
        AllowRestrictedUser: false
        # The restricted user feature will kick players listed below
        # if they don't match the defined IP address. Names are case-insensitive.
        AllowedRestrictedUser: []
        # Ban unknown IPs trying to log in with a restricted username?
        banUnsafedIP: false
        # Should unregistered players be kicked immediately?
        # [HARDENED] false = we WANT new players to be able to /register
        kickNonRegistered: false
        # Should players be kicked on wrong password?
        # [HARDENED] true = no endless guessing attempts
        kickOnWrongPassword: true
        # Should not logged in players be teleported to the spawn?
        # After the authentication they will be teleported back to
        # their normal position.
        teleportUnAuthedToSpawn: false
        # Can unregistered players walk around?
        # [HARDENED] false = players are frozen until they log in
        allowMovement: false
        # After how many seconds should players who fail to login be kicked?
        # Set to 0 to disable.
        # [HARDENED] 20s is plenty to type a password
        loginTimeout: 20
        # After how many seconds should players who fail to register be kicked?
        # Set to 0 to disable.
        registerTimeout: 60
        # Regex pattern of allowed characters in the player name.
        allowedNicknameCharacters: '[a-zA-Z0-9_]*'
        # How far can unregistered players walk?
        # Set to 0 for unlimited radius
        allowedMovementRadius: 100
        # Should we protect the player inventory before logging in? Requires PacketEvents.
        # [HARDENED] true = items/armor are hidden until login.
        # Install PacketEvents 2.x (modrinth.com/plugin/packetevents) for this to work.
        ProtectInventoryBeforeLogIn: true
        # Should we deny the tabcomplete feature before logging in? Requires PacketEvents.
        # [HARDENED] true = unlogged players can't tab-complete commands
        DenyTabCompleteBeforeLogin: true
        # Should we display all other accounts from a player when he joins?
        # permission: /authme.admin.accounts
        # [HARDENED] true = staff instantly see if a player owns alt accounts
        displayOtherAccounts: true
        # Spawn priority; values: authme, essentials, cmi, multiverse, default, server
        spawnPriority: authme,essentials,cmi,multiverse,default
        # Maximum Login authorized by IP
        # [HARDENED] 3 = at most 3 different usernames may log in from one IP
        maxLoginPerIp: 3
        # Maximum Join authorized by IP
        # [HARDENED] 5 = at most 5 join attempts per IP (anti-bot)
        maxJoinPerIp: 5
        # AuthMe will NEVER teleport players if set to true!
        noTeleport: false
        # Regex syntax for allowed chars in passwords. The default [!-~] allows all visible ASCII
        # characters, which is what we recommend. See also http://asciitable.com
        allowedPasswordCharacters: '[!-~]*'
    GameMode:
        # Force survival gamemode when player joins?
        # [HARDENED] true = no creative-mode tricks before login
        ForceSurvivalMode: true
    unrestrictions:
        # Below you can list all account names that AuthMe will ignore
        # for registration or login. Configure it at your own risk!!
        # It is case-insensitive! Example:
        # UnrestrictedName:
        # - 'npcPlayer'
        UnrestrictedName: []
        # Below you can list all inventories names that AuthMe will ignore
        # for registration or login. Configure it at your own risk!!
        UnrestrictedInventories: []
    security:
        # Minimum length of password
        # [HARDENED] 10 characters minimum (default was 5)
        minPasswordLength: 10
        # Maximum length of password
        passwordMaxLength: 30
        # Possible values: SHA256, BCRYPT, BCRYPT2Y, PBKDF2, SALTEDSHA512,
        # MYBB, IPB3, PHPBB, PHPFUSION, SMF, XENFORO, JOOMLA, WBB3, WBB4, MD5VB,
        # PBKDF2DJANGO, WORDPRESS, ROYALAUTH, ARGON2, CUSTOM (for developers only).
        # See https://github.com/AuthMe/AuthMeReloaded/blob/master/docs/hash_algorithms.md
        # [HARDENED] BCRYPT2Y (default was SHA256). Slow, salted, GPU-resistant.
        # ARGON2 is even stronger but needs the argon2 C library installed on Windows.
        passwordHash: BCRYPT2Y
        # If a password check fails, AuthMe will also try to check with the following hash methods.
        # Use this setting when you change from one hash method to another.
        # AuthMe will update the password to the new hash. Example:
        # legacyHashes:
        # - 'SHA1'
        legacyHashes: []
        # Salt length for the SALTED2MD5 MD5(MD5(password)+salt)
        doubleMD5SaltLength: 8
        # Number of rounds to use if passwordHash is set to PBKDF2. Default is 10000
        pbkdf2Rounds: 10000
        # Prevent unsafe passwords from being used; put them in lowercase!
        # You should always set 'help' as unsafePassword due to possible conflicts.
        # [HARDENED] extended blacklist
        unsafePasswords:
        - '123456'
        - password
        - qwerty
        - '12345'
        - '54321'
        - '123456789'
        - help
        - 'password1'
        - admin
        - minecraft
        - changeme
        - letmein
        - iloveyou
        - '111111'
        - abc123
    registration:
        # Enable registration on the server?
        enabled: true
        # Send every X seconds a message to a player to
        # remind him that he has to login/register
        messageInterval: 5
        # Only registered and logged in players can play.
        # See restrictions for exceptions
        # [HARDENED] true = nobody plays without an account
        force: true
        # Type of registration: PASSWORD or EMAIL
        type: PASSWORD
        # Second argument the /register command should take: NONE = no 2nd argument
        # CONFIRMATION = must repeat first argument (pass or email)
        # EMAIL_OPTIONAL = for password register: 2nd argument can be empty or have email address
        # EMAIL_MANDATORY = for password register: 2nd argument MUST be an email address
        # [HARDENED] CONFIRMATION = typo-proof passwords
        secondArg: CONFIRMATION
        # Do we force kick a player after a successful registration?
        # Do not use with login feature below
        forceKickAfterRegister: false
        # Does AuthMe need to enforce a /login after a successful registration?
        forceLoginAfterRegister: false
        dialog:
            # Show a 'Forgot Password?' button in the post-join login dialog.
            showForgotPasswordButton: true
            # Show a short description body in login, register, and two-factor dialogs.
            showBody: true
            preJoin:
                # Show the login/register dialog during the Paper/Folia pre-join phase.
                enable: true
                # Show a cancel button in Paper/Folia pre-join dialogs.
                showCancelButton: true
                # Allow closing Paper/Folia pre-join dialogs with Escape.
                allowCloseWithEscape: false
                # Kick players who cancel the Paper/Folia pre-join register dialog.
                registerCancelKicks: false
                # Kick players who cancel the Paper/Folia pre-join login dialog.
                # [HARDENED] true = you must log in, period
                loginCancelKicks: true
            postJoin:
                # Show a graphical dialog UI for post-join login/register instead of chat messages.
                # Requires Minecraft 1.21.6+ on Spigot, or 1.21.11+ on Paper.
                enable: true
    # Enable to display the welcome message (welcome.txt) after a login
    # You can use colors in this welcome.txt + some replaced strings:
    # {PLAYER}: player name, {ONLINE}: display number of online players,
    # {MAXPLAYERS}: display server slots, {IP}: player ip, {LOGINS}: number of players logged,
    # {WORLD}: player current world, {SERVER}: server name
    useWelcomeMessage: true
    # Broadcast the welcome message to the server or only to the player?
    broadcastWelcomeMessage: false
    # Should we delay the join message and display it once the player has logged in?
    # [HARDENED] true = fake "join spam" is hidden until authentication
    delayJoinMessage: true
    # The custom join message that will be sent after a successful login,
    # keep empty to use the original one.
    customJoinMessage: ''
    # Should we remove the leave messages of unlogged users?
    removeUnloggedLeaveMessage: true
    # Should we remove join messages altogether?
    removeJoinMessage: false
    # Should we remove leave messages altogether?
    removeLeaveMessage: false
    # Do we need to add potion effect Blinding before login/register?
    # [HARDENED] true = unlogged players can't see the world around them
    applyBlindEffect: true
    # Do we need to prevent people to login with another case?
    # If Xephi is registered, then Xephi can login, but not XEPHI/xephi/XePhI
    # [HARDENED] true = blocks case-swap account stealing
    preventOtherCase: true
    # Enable premium mode: players with an official Minecraft account
    # can skip password authentication.
    # [HARDENED] false = keep it simple on a fully cracked server.
    enablePremium: false
GroupOptions:
    # Enables switching a player to defined permission groups before they log in.
    # See below for a detailed explanation.
    # [HARDENED] true = unlogged players are moved into a zero-permission group
    enablePermissionCheck: true
    # This is a very important option: if a registered player joins the server
    # AuthMe will switch him to unLoggedInGroup. This should prevent all major exploits.
    # After login, the player will be moved to his correct permissions group!
    # IMPORTANT: create this group in LuckPerms BEFORE opening the server:
    #     /lp creategroup authme-unlogged
    # [HARDENED] both registered and unregistered players get the SAME
    # locked-down group until they authenticate.
    registeredPlayerGroup: 'authme-unlogged'
    # Similar to above, unregistered players can be set to the following
    # permissions group
    unregisteredPlayerGroup: 'authme-unlogged'
Email:
    # Email SMTP server host
    mailSMTP: smtp.gmail.com
    # Email SMTP server port.
    mailPort: 465
    # Only applies to port 25: enable STARTTLS on the plain SMTP connection?
    useTls: true
    # Email account which sends the mails
    mailAccount: ''
    # Email account password
    mailPassword: ''
    # Email address, fill when mailAccount is not the email address of the account
    mailAddress: ''
    # Custom sender name, replacing the mailAccount name in the email
    mailSenderName: ''
    # Recovery password length
    RecoveryPasswordLength: 8
    # Mail Subject
    mailSubject: Your new AuthMe password
    # Like maxRegPerIP but with email
    maxRegPerEmail: 1
    # Recall players to add an email?
    recallPlayers: false
    # Delay in minute for the recall scheduler
    delayRecall: 5
    # Blacklist these domains for emails
    emailBlacklisted:
    - 10minutemail.com
    # Whitelist ONLY these domains for emails
    emailWhitelisted: []
    # Send the new password drawn in an image?
    generateImage: false
    # The OAuth2 token
    emailOauth2Token: ''
    # Verify the SSL/TLS server certificate hostname?
    sslCheckServerIdentity: true
Hooks:
    # Do we need to hook with multiverse for spawn checking?
    multiverse: true
    # Do we need to hook with BungeeCord?
    # [HARDENED] false = single server behind playit.gg (a tunnel, not a proxy)
    bungeecord: false
    # Send player to this BungeeCord server after register/login
    sendPlayerTo: ''
    # Shared secret used to verify perform.login messages from the AuthMe proxy plugin.
    proxySharedSecret: ''
    # Do we need to disable Essentials SocialSpy on join?
    disableSocialSpy: false
    # Do we need to force /motd Essentials command on join?
    useEssentialsMotd: false
Protection:
    # Enable some servers protection (country based login, antibot)
    # [HARDENED] see note below: the antibot inside this section is a great
    # defense against registration floods. Requires a free MaxMind license
    # key for the GeoIP part - if you skip it, set geoIpDatabase.enabled: false.
    enableProtection: false
    # Apply the protection also to registered usernames
    enableProtectionRegistered: true
    geoIpDatabase:
        # Enable GeoIp database
        enabled: true
        # The MaxMind clientId used to download the GeoIp database,
        # get one at https://www.maxmind.com/en/accounts/current/license-key
        clientId: ''
        # The MaxMind licenseKey used to download the GeoIp database.
        licenseKey: ''
    # Countries allowed to join the server and register.
    # Use "LOCALHOST" for local addresses.
    countries:
    - US
    - GB
    - LOCALHOST
    # Countries not allowed to join the server and register
    countriesBlacklist:
    - A1
    # Do we need to enable automatic antibot system?
    enableAntiBot: true
    # The interval in seconds
    antiBotInterval: 5
    # Max number of players allowed to login in the interval
    # before the AntiBot system is enabled automatically
    antiBotSensibility: 10
    # Duration in minutes of the antibot automatic system
    antiBotDuration: 10
    # Delay in seconds before the antibot activation
    antiBotDelay: 60
    quickCommands:
        # Kicks the player that issued a command before the defined time after the join process
        denyCommandsBeforeMilliseconds: 1000
Purge:
    # If enabled, AuthMe automatically purges old, unused accounts
    # [HARDENED] enable this after a few months to remove dead accounts
    useAutoPurge: false
    # Number of days after which an account should be purged
    daysBeforeRemovePlayer: 60
    # Do we need to remove the player.dat file during purge process?
    removePlayerDat: false
    # Do we need to remove the Essentials/userdata/player.yml file during purge process?
    removeEssentialsFile: false
    # World in which the players.dat are stored
    defaultWorld: world
    # Remove LimitedCreative/inventories/player.yml, player_creative.yml files during purge?
    removeLimitedCreativesInventories: false
    # Do we need to remove the AntiXRayData/PlayerData/player file during purge process?
    removeAntiXRayFile: false
    # Do we need to remove permissions?
    removePermissions: false
Security:
    SQLProblem:
        # Stop the server if we can't contact the sql database
        # Take care with this, if you set this to false,
        # AuthMe will automatically disable and the server won't be protected!
        # [HARDENED] true = fail closed. No DB = no server.
        stopServer: true
    console:
        # Copy AuthMe log output in a separate file as well?
        logConsole: true
    captcha:
        # Enable captcha when a player uses wrong password too many times
        # [HARDENED] true = brute-force protection
        useCaptcha: true
        # Max allowed tries before a captcha is required
        maxLoginTry: 5
        # Captcha length
        captchaLength: 5
        # Minutes after which login attempts count is reset for a player
        captchaCountReset: 60
        # Require captcha before a player may register?
        requireForRegistration: false
    tempban:
        # Tempban a user's IP address if they enter the wrong password too many times
        # [HARDENED] true = automatic IP tempban on repeated failures
        enableTempban: true
        # How many times a user can attempt to login before their IP being tempbanned
        # [HARDENED] 5 attempts, then IP is banned
        maxLoginTries: 5
        # The length of time a IP address will be tempbanned in minutes
        # Default: 480 minutes, or 8 hours
        # [HARDENED] 1440 minutes = 24 hours
        tempbanLength: 1440
        # How many minutes before resetting the count for failed logins by IP and username
        minutesBeforeCounterReset: 480
        # The command to execute instead of using the internal ban system, empty if disabled.
        customCommand: ''
    recoveryCode:
        # Number of characters a recovery code should have (0 to disable)
        length: 8
        # How many hours is a recovery code valid for?
        validForHours: 4
        # Max number of tries to enter recovery code
        maxTries: 3
        # How long a player has after password recovery to change their password
        # without logging in. This is in minutes.
        passwordChangeTimeout: 2
    emailRecovery:
        # Seconds a user has to wait for before a password recovery mail may be sent again
        cooldown: 60
    privacy:
        # The mail shown using /email show will be partially hidden
        enableEmailMasking: false
        # Minutes after which a verification code will expire
        verificationCodeExpiration: 10
# Before a user logs in, various properties are temporarily removed from the player,
# such as OP status, ability to fly, and walk/fly speed.
# Once the user is logged in, we add back the properties we previously saved.
limbo:
    persistence:
        # Besides storing the data in memory, you can define if/how the data should be persisted
        # on disk. This is useful in case of a server crash, so next time the server starts we can
        # properly restore things like OP status, ability to fly, and walk/fly speed.
        type: INDIVIDUAL_FILES
        # This setting only affects DISTRIBUTED_FILES persistence.
        distributionSize: SIXTEEN
    # Whether the player is allowed to fly: RESTORE, ENABLE, DISABLE, NOTHING.
    restoreAllowFlight: RESTORE
    # Restore fly speed: RESTORE, DEFAULT, MAX_RESTORE, RESTORE_NO_ZERO.
    restoreFlySpeed: RESTORE_NO_ZERO
    # Restore walk speed: RESTORE, DEFAULT, MAX_RESTORE, RESTORE_NO_ZERO.
    restoreWalkSpeed: RESTORE_NO_ZERO
    # If true, AuthMe recreates tracked ender pearls after login when the original entity
    # cannot be found anymore.
    recreateEnderPearls: true
BackupSystem:
    # General configuration for backups: if false, no backups are possible
    # [HARDENED] we use the separate backup.bat instead (server/backup.bat)
    ActivateBackup: false
    # Create backup at every start of server
    OnServerStart: false
    # Create backup at every stop of server
    OnServerStop: true
    # Windows only: MySQL installation path
    MysqlWindowsPath: C:\Program Files\MySQL\MySQL Server 5.1\
